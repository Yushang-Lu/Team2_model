data:
  train_dir: data/train
  val_dir: null
  test_dir: null
  validation_split: 0.15
  image_size: [64, 64]
  batch_size: 32
  num_classes: 3
  seed: 42
  augmentation:
    horizontal_flip: true
    rotation_factor: 0.02
    zoom_factor: 0.05

model:
  backbone: MobileNetV3Small
  weights: imagenet
  dropout_rate: 0.2

training:
  stage1_epochs: 12
  stage2_epochs: 36
  stage1_learning_rate: 0.001
  stage2_learning_rate: 0.0001
  fine_tune_layers: 12
  early_stopping_patience: 8
  reduce_lr_patience: 3
  reduce_lr_factor: 0.2

paths:
  artifact_dir: artifacts
  log_dir: logs
  report_dir: reports
  tflite_report_dir: reports/tflite
  compare_report_dir: reports/compare

export:
  tflite_path: artifacts/model.tflite
  quantize: dynamic
