data:
  train_dir: data/train
  val_dir: null
  test_dir: null
  validation_split: 0.15
  image_size: [64, 64]
  batch_size: 16
  num_classes: 3
  seed: 42
  augmentation:
    horizontal_flip: true
    rotation_factor: 0.02
    zoom_factor: 0.05
    brightness_delta: 0.1
    contrast_factor: 0.12

model:
  backbone: MobileNetV3Large
  weights: imagenet
  dropout_rate: 0.25

training:
  stage1_epochs: 12
  stage2_epochs: 60
  stage1_learning_rate: 0.0008
  stage2_learning_rate: 0.00005
  fine_tune_layers: 30
  early_stopping_patience: 12
  reduce_lr_patience: 2
  reduce_lr_factor: 0.5

paths:
  artifact_dir: artifacts
  log_dir: logs
  report_dir: reports
  tflite_report_dir: reports/tflite
  compare_report_dir: reports/compare

export:
  tflite_path: artifacts/model.tflite
  quantize: dynamic
